<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doce papelitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COLORES Y TIPOS
   ============================================================ */
:root{
  --noche:#1C1730;
  --noche-alta:#2A2247;
  --papel:#F6E7D8;
  --papel-sombra:#E3CDB8;
  --tinta:#2E2547;
  --frambuesa:#E4557B;
  --luz:#F3D9C6;

  --serif:"Fraunces", Georgia, serif;
  --mano:"Caveat", "Segoe Script", cursive;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--noche);
  color:var(--luz);
  font-family:var(--serif);
  font-weight:300;
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* puntitos de luz al fondo, muy tenues */
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(1.5px 1.5px at 18% 22%, rgba(243,217,198,.5), transparent),
    radial-gradient(1.5px 1.5px at 72% 14%, rgba(243,217,198,.35), transparent),
    radial-gradient(1.5px 1.5px at 41% 68%, rgba(243,217,198,.3), transparent),
    radial-gradient(2px 2px at 88% 55%, rgba(228,85,123,.35), transparent),
    radial-gradient(1.5px 1.5px at 9% 80%, rgba(243,217,198,.3), transparent),
    radial-gradient(1.5px 1.5px at 60% 91%, rgba(243,217,198,.25), transparent);
  pointer-events:none;
  z-index:0;
}

.envoltura{position:relative; z-index:1; max-width:920px; margin:0 auto; padding:0 24px 96px}

/* ============================================================
   PORTADA
   ============================================================ */
.portada{
  min-height:88vh;
  display:flex; flex-direction:column; justify-content:center;
  padding:64px 0 32px;
}
.saludo{
  font-family:var(--mano);
  font-size:clamp(26px,5vw,38px);
  color:var(--frambuesa);
  margin-bottom:12px;
  transform:rotate(-2deg);
  transform-origin:left;
}
.titulo{
  font-family:var(--serif);
  font-weight:300;
  font-size:clamp(40px,9vw,84px);
  line-height:1.02;
  letter-spacing:-.02em;
  max-width:14ch;
  margin-bottom:28px;
}
.intro{
  font-size:clamp(16px,2.4vw,19px);
  max-width:46ch;
  color:rgba(243,217,198,.78);
}
.baja{
  margin-top:56px;
  font-family:var(--mano);
  font-size:22px;
  color:rgba(243,217,198,.6);
  display:flex; align-items:center; gap:10px;
}
.baja span{
  display:inline-block; width:1px; height:34px;
  background:linear-gradient(var(--frambuesa), transparent);
}

/* ============================================================
   CONTADOR
   ============================================================ */
.contador{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:14px;
  padding:16px 0;
  background:linear-gradient(var(--noche) 62%, transparent);
  font-size:15px;
  color:rgba(243,217,198,.7);
}
.barra{flex:1; height:2px; background:rgba(243,217,198,.16); border-radius:2px; overflow:hidden}
.barra i{display:block; height:100%; width:0; background:var(--frambuesa); transition:width .5s ease}

/* ============================================================
   PAPELITOS
   ============================================================ */
.reja{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
  gap:20px;
  margin-top:8px;
}

.papelito{
  border:0; padding:0; background:none;
  aspect-ratio:1/1;
  cursor:pointer;
  font:inherit;
  opacity:1;
}
.papelito.entrando{
  opacity:0;
  transform:translateY(22px) rotate(var(--giro));
}
.papelito.mostrado{
  opacity:1;
  transform:translateY(0) rotate(var(--giro));
  transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.3,1);
}

.cara{
  display:block;
  position:relative; width:100%; height:100%;
}
.papelito[aria-pressed="true"] .frente{opacity:.55}
.papelito[aria-pressed="true"] .frente::after{opacity:1; transform:scale(1.4); background:var(--tinta)}

.frente{
  display:flex;
  position:absolute; inset:0;
  border-radius:3px;
  align-items:center; justify-content:center;
  box-shadow:0 10px 26px rgba(0,0,0,.35);
  transition:opacity .3s, box-shadow .3s;
}

/* cara doblada */
.frente{
  background:
    linear-gradient(105deg, transparent 47.6%, var(--papel-sombra) 48%, transparent 48.6%),
    linear-gradient(-14deg, transparent 49.4%, var(--papel-sombra) 50%, transparent 50.6%),
    linear-gradient(150deg, #FBF0E4, var(--papel) 60%, #EBD9C6);
}
.frente::after{
  content:"";
  width:9px; height:9px;
  border-radius:50%;
  background:var(--frambuesa);
  opacity:.55;
  transition:opacity .3s, transform .3s;
}
.papelito:hover .frente::after,
.papelito:focus-visible .frente::after{opacity:1; transform:scale(1.4)}
.papelito:hover .frente{box-shadow:0 16px 34px rgba(0,0,0,.45)}

.papelito:focus-visible{outline:2px solid var(--frambuesa); outline-offset:6px; border-radius:6px}

/* ============================================================
   VENTANA DEL PAPELITO
   ============================================================ */
.velo{
  position:fixed; inset:0; z-index:20;
  background:rgba(15,11,26,.72);
  backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  opacity:0; pointer-events:none;
  transition:opacity .25s ease;
}
.velo.visible{opacity:1; pointer-events:auto}

.hoja{
  position:relative;
  width:min(440px, 100%);
  max-height:80vh;
  overflow-y:auto;
  background:linear-gradient(165deg, #FBF0E4, var(--papel));
  color:var(--tinta);
  border-radius:4px;
  padding:52px 36px;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
  transform:scale(.92) translateY(10px);
  transition:transform .3s cubic-bezier(.2,.8,.3,1.1);
  text-align:center;
}
.velo.visible .hoja{transform:scale(1) translateY(0)}

.hoja p{
  font-family:var(--mano);
  font-size:clamp(24px,4.5vw,30px);
  line-height:1.4;
}

.cerrar{
  position:absolute; top:10px; right:14px;
  background:none; border:0;
  font-size:26px; line-height:1;
  color:var(--tinta);
  opacity:.45;
  cursor:pointer;
  padding:8px;
  transition:opacity .2s;
}
.cerrar:hover, .cerrar:focus-visible{opacity:.9}

/* ============================================================
   CARTA FINAL
   ============================================================ */
.carta{
  margin-top:64px;
  border-top:1px solid rgba(243,217,198,.16);
  padding-top:48px;
}
.candado{
  font-family:var(--mano);
  font-size:24px;
  color:rgba(243,217,198,.5);
}
.abrir{
  display:none;
  border:1px solid var(--frambuesa);
  background:transparent;
  color:var(--luz);
  font-family:var(--serif);
  font-size:17px;
  padding:14px 30px;
  border-radius:2px;
  cursor:pointer;
  transition:background .3s, color .3s;
}
.abrir:hover{background:var(--frambuesa); color:#fff}
.abrir:focus-visible{outline:2px solid var(--luz); outline-offset:4px}
.carta.lista .candado{display:none}
.carta.lista .abrir{display:inline-block}
.carta.abierta .abrir{display:none}

.texto-carta{
  font-family:var(--mano);
  font-size:clamp(23px,3.4vw,30px);
  line-height:1.5;
  max-width:26ch;
  white-space:pre-wrap;
  min-height:2em;
}
.texto-carta::after{
  content:"|";
  color:var(--frambuesa);
  animation:latir 1s steps(2) infinite;
}
.texto-carta.fin::after{content:""}
@keyframes latir{50%{opacity:0}}

.firma{
  margin-top:36px;
  font-family:var(--mano);
  font-size:26px;
  color:var(--frambuesa);
  opacity:0;
  transition:opacity 1s;
}
.firma.vista{opacity:1}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="envoltura">

  <header class="portada">
    <p class="saludo" id="saludo"></p>
    <h1 class="titulo" id="titulo"></h1>
    <p class="intro" id="intro"></p>
    <p class="baja"><span></span>desliza</p>
  </header>

  <div class="contador">
    <span id="marcador"></span>
    <span class="barra"><i id="progreso"></i></span>
  </div>

  <main class="reja" id="reja"></main>

  <section class="carta" id="carta">
    <p class="candado" id="candado"></p>
    <button class="abrir" id="abrir"></button>
    <p class="texto-carta" id="textoCarta" hidden></p>
    <p class="firma" id="firma"></p>
  </section>

</div>

<div class="velo" id="velo">
  <div class="hoja" role="dialog" aria-modal="true">
    <button class="cerrar" id="cerrarVelo" aria-label="Cerrar">×</button>
    <p id="textoVelo"></p>
  </div>
</div>

<script>
/* ============================================================
   ✏️  CAMBIA SOLO ESTO
   ============================================================ */
const CONTENIDO = {

  saludo: "Para Valentina,",

  titulo: "Doce cosas que no te dije cuando pude",

  intro: "Cada papelito tiene una. Ábrelos en el orden que quieras, o todos de una vez, o uno cada día. Cuando no quede ninguno cerrado, hay algo más.",

  // Los doce papelitos. Cámbialos por cosas de ustedes:
  // manías, frases que ella dice, cosas que hizo y no sabe que notaste.
  // Mejor concretas que bonitas. "Cómo dices 'ay, no' cuando algo te da pena"
  // le va a pegar más que "eres increíble".
  papelitos: [
    "Me haces sentir mariposas en el estómago.",
    "Me encanta mucho lo cariñosa que sos conmigo.",
    "AMO MUCHÍSIMO ESOS OJITOS HERMOSOS QUE TIENES <3",
    "Me gusta tu sonrisa.",
    "Me gusta lo espontánea que sos.",
    "Adoro cuando te avergüenzas de algo.",
    "Amo cuando te preocupas por mí.",
    "Definitivamente me enamoré de ti en poco tiempo.",
    "Tus ojos me hechizaron cuando los tuve frente a frente.",
    "Me quedé con más ganas de besarte.",
    "Te pienso 24/7.",
    "Me tienes completamente loooooco, cielo."
  ],

  // Texto mientras faltan papelitos por abrir
  candado: "Falta algo aquí abajo. Aparece cuando no quede ningún papelito cerrado.",

  // Botón de la carta final
  botón: "Abrir lo último",

  // La carta. Se escribe sola, letra por letra.
  // Los saltos de línea se respetan.
  carta: "No es tu cumpleaños, no es aniversario, no pasó nada.\n\nSolo me acordé de que nunca pude alcanzar a decirte estas cosas en voz alta, y me pareció injusto que se quedaran adentro.\n\nYa está. Eso era todo.",

  firma: "— Te quiero un chingo mi niña de ojitos achinados"
};
/* ============================================================
   De aquí para abajo no hace falta tocar nada
   ============================================================ */

const $ = id => document.getElementById(id);
const menosMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

$("saludo").textContent = CONTENIDO.saludo;
$("titulo").textContent = CONTENIDO.titulo;
$("intro").textContent  = CONTENIDO.intro;
$("candado").textContent = CONTENIDO.candado;
$("abrir").textContent  = CONTENIDO.botón;
$("firma").textContent  = CONTENIDO.firma;

const total = CONTENIDO.papelitos.length;
let abiertos = 0;

function marcar(){
  $("marcador").textContent = abiertos === 0
    ? `${total} papelitos, ninguno abierto`
    : abiertos === total
      ? "Todos abiertos"
      : `${abiertos} de ${total} abiertos`;
  $("progreso").style.width = (abiertos / total * 100) + "%";
  if (abiertos === total) $("carta").classList.add("lista");
}

CONTENIDO.papelitos.forEach((texto, i) => {
  const b = document.createElement("button");
  b.className = "papelito entrando";
  b.setAttribute("aria-pressed", "false");
  b.setAttribute("aria-label", "Papelito sin abrir");
  b.style.setProperty("--giro", (Math.random() * 4 - 2).toFixed(2) + "deg");
  b.innerHTML = `<span class="cara"><span class="frente"></span></span>`;

  b.addEventListener("click", () => {
    if (b.getAttribute("aria-pressed") !== "true"){
      b.setAttribute("aria-pressed", "true");
      b.setAttribute("aria-label", "Ya abierto: " + texto);
      abiertos++;
      marcar();
    }
    $("textoVelo").textContent = texto;
    $("velo").classList.add("visible");
  });

  $("reja").appendChild(b);

  setTimeout(() => {
    b.classList.remove("entrando");
    b.classList.add("mostrado");
  }, menosMovimiento ? 0 : i * 60 + 80);
});

marcar();

function cerrarVentana(){ $("velo").classList.remove("visible"); }
$("cerrarVelo").addEventListener("click", cerrarVentana);
$("velo").addEventListener("click", e => { if (e.target.id === "velo") cerrarVentana(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarVentana(); });

$("abrir").addEventListener("click", () => {
  $("carta").classList.add("abierta");
  const p = $("textoCarta");
  p.hidden = false;
  p.scrollIntoView({ behavior: menosMovimiento ? "auto" : "smooth", block: "center" });

  if (menosMovimiento){
    p.textContent = CONTENIDO.carta;
    p.classList.add("fin");
    $("firma").classList.add("vista");
    return;
  }

  let n = 0;
  (function escribir(){
    p.textContent = CONTENIDO.carta.slice(0, ++n);
    if (n < CONTENIDO.carta.length){
      const c = CONTENIDO.carta[n - 1];
      setTimeout(escribir, c === "\n" ? 260 : (c === "." || c === ",") ? 200 : 42);
    } else {
      p.classList.add("fin");
      setTimeout(() => $("firma").classList.add("vista"), 500);
    }
  })();
});
</script>
</body>
</html>
